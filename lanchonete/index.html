function estaAberto(agora = new Date()) {
  const h = LOJA.horarios[agora.getDay()];
  if (!h) return false;
  const [ini, fim] = h.split("-").map(t => { const [a, b] = t.split(":"); return +a * 60 + +b; });
  const min = agora.getHours() * 60 + agora.getMinutes();
  return fim > ini ? min >= ini && min < fim : min >= ini || min < fim;
}

const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(sacola)); } catch {} atualizarContador(); };
const somaAdds = adds => (adds || []).reduce((s, a) => s + ADICIONAIS[a][1], 0);
const precoItem = i => ((i.trio ? ITENS[i.n].trio : ITENS[i.n].sand) + somaAdds(i.adds)) * i.qtd;
const subtotal = () => sacola.reduce((s, i) => s + precoItem(i), 0);
const nomeItem = i => ITENS[i.n].titulo + (ITENS[i.n].trio == null ? "" : i.trio ? ` (Trio${i.refri ? ` – ${i.refri}` : ""})` : " (Sanduíche)")
  + (i.adds?.length ? ` + ${i.adds.map(a => ADICIONAIS[a][0]).join(", ")}` : "");
const selo = it => it.num ? `<span class="num">${it.num}</span>${it.desc}` : it.titulo;

function atualizarContador() {
  const c = document.getElementById("contador");
  const qtd = sacola.reduce((s, i) => s + i.qtd, 0);
  c.textContent = qtd; c.hidden = !qtd;
}
function avisar(msg) {
  const a = document.getElementById("aviso");
  a.textContent = msg; a.hidden = false;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => a.hidden = true, 2000);
}
const barra = (titulo, voltar) => `<div class="barra">${voltar ? `<button class="voltar" onclick="history.length > 1 ? history.back() : location.hash='#/'" aria-label="Voltar">‹</button>` : ""}<h1>${titulo}</h1></div>`;
const statusHTML = () => `<div class="status ${estaAberto() ? "aberto" : "fechado"}">${textoStatus()}</div>`;

// ===== Telas =====

  app.innerHTML = `

    <div class="topo">
      <img src="img/logo-w.jpg" alt="Logo ${LOJA.nome}" width="600" height="600">
      <h2>
        <span class="junto"><svg class="fita" viewBox="0 0 60 92" role="img" aria-label="Fita da conscientização do autismo">

    <input class="busca" id="busca" type="search" placeholder="🔍 Buscar lanche (ex.: bacon, frango, 7)" aria-label="Buscar lanche">

    const achados = ITENS.map((it, id) => [it, id]).filter(([it]) => !q || semAcento(`${it.titulo} ${it.desc}`).includes(q) || String(it.num) === q);
    lista.innerHTML = achados.length ? CATEGORIAS.map(cat => {

function telaProduto(n) {
  const it = ITENS[n];
  if (!it) return (location.hash = "#/");
  let trio = false, qtd = 1, adds = [];
  app.innerHTML = `
    ${barra("Detalhes do produto", true)}
    ${it.img ? `<div class="detalhe"><img class="${it.num ? "" : "escuro"}" src="${it.img}" alt="${it.titulo}" width="196" height="106"></div>` : ""}
    <div class="bloco"><h2>${selo(it)}</h2>${it.num ? "" : `<p>${it.desc}</p>`}<div class="preco">${it.trio ? "a partir de " : ""}${it.de ? `<s class="de">${real(it.de)}</s> ` : ""}${real(it.sand)}</div></div>
    ${it.trio ? `
    <div class="titulo-sec">Como você quer? <small>Obrigatório</small></div>
    <label class="opcao"><span>Só o sanduíche</span><span>${real(it.sand)} <input type="radio" name="tipo" value="0" checked></span></label>
    <label class="opcao"><span>Trio<br><small style="color:var(--texto-suave)">Lanche + batata frita + refri lata</small></span><span>${real(it.trio)} <input type="radio" name="tipo" value="1"></span></label>
    <div class="bloco" id="campoRefri" hidden>
      <label class="campo" for="refri">Sabor do refri</label>
      <select id="refri">${REFRIS.map(r => `<option>${r}</option>`).join("")}</select>
    </div>` : ""}
    ${it.num ? `
    <div class="titulo-sec">Adicionais <small>Opcional</small></div>
    ${ADICIONAIS.map(([nome, preco], a) => `<label class="opcao"><span>${nome}</span><span>+ ${real(preco)} <input type="checkbox" name="add" value="${a}"></span></label>`).join("")}
    <div class="titulo-sec">Complementos <small>Grátis</small></div>
    ${COMPLEMENTOS.map(c => `<label class="opcao"><span>${c}</span><input type="checkbox" name="compl" value="${c}"></label>`).join("")}
` : ""}
    ${it.num || it.molhos ? `
    <div class="titulo-sec">Molhos especiais <small>Grátis</small></div>
    ${MOLHOS.map(m => `<label class="opcao"><span>${m}</span><input type="checkbox" name="molho" value="${m}"></label>`).join("")}` : ""}
    ${(it.escolhas || []).map(([titulo, opcoes], g) => `
    <div class="titulo-sec">${titulo} · escolha um <small>Obrigatório</small></div>
    ${opcoes.map((o, k) => `<label class="opcao"><span>${o}</span><input type="radio" name="esc${g}" value="${o}" ${k ? "" : "checked"}></label>`).join("")}`).join("")}
    ${it.cat === "Açaí" ? `
    <div class="titulo-sec">Acompanhamentos <small>Grátis</small></div>
    ${ACOMPANHAMENTOS.map(a => `<label class="opcao"><span>${a}</span><input type="checkbox" name="acomp" value="${a}"></label>`).join("")}
    <div class="titulo-sec">Calda · escolha uma <small>Grátis</small></div>
    <label class="opcao"><span>Sem calda</span><input type="radio" name="calda" value="" checked></label>
    ${CALDAS.map(c => `<label class="opcao"><span>${c}</span><input type="radio" name="calda" value="${c}"></label>`).join("")}` : ""}
    ${SEM_OBS.includes(it.cat) ? "" : `
    <div class="titulo-sec">Observações</div>
    <div class="bloco"><textarea id="obs" rows="3" maxlength="200" placeholder="Ex.: tirar cebola, sem molho, etc."></textarea></div>`}
    <div class="rodape"><div class="dentro">
      <div class="qtd"><button id="menos" aria-label="Diminuir">−</button><span id="q">1</span><button id="mais" aria-label="Aumentar">+</button></div>
      <button class="btn" id="add"></button>
    </div></div>`;
  const atualizar = () => {
    document.getElementById("q").textContent = qtd;
    document.getElementById("add").textContent = `Adicionar ${real(((trio ? it.trio : it.sand) + somaAdds(adds)) * qtd)}`;
  };
  app.querySelectorAll("[name=tipo]").forEach(r => r.onchange = () => { trio = r.value === "1"; document.getElementById("campoRefri").hidden = !trio || !REFRIS.length; atualizar(); });
  app.querySelectorAll("[name=add]").forEach(c => c.onchange = () => { adds = [...app.querySelectorAll("[name=add]:checked")].map(x => +x.value); atualizar(); });
  document.getElementById("menos").onclick = () => { if (qtd > 1) qtd--; atualizar(); };
  document.getElementById("mais").onclick = () => { qtd++; atualizar(); };
  document.getElementById("add").onclick = () => {
    const obs = document.getElementById("obs")?.value.trim() || "";
    const refri = trio && REFRIS.length ? document.getElementById("refri").value : "";
    const acomp = [...app.querySelectorAll("[name=acomp]:checked")].map(x => x.value);
    const calda = app.querySelector("[name=calda]:checked")?.value || "";
    const escolhidos = (it.escolhas || []).map(([titulo], g) => `${titulo}: ${app.querySelector(`[name=esc${g}]:checked`).value}`);
    const marcados = nome => [...app.querySelectorAll(`[name=${nome}]:checked`)].map(x => x.value);
    const compl = marcados("compl"), molhos = marcados("molho");
    const extras = [escolhidos.join(", "), acomp.join(", "), calda && `Calda de ${calda.toLowerCase()}`,
      compl.length && `Com ${compl.join(", ").toLowerCase()}`, molhos.length && `Molhos: ${molhos.join(", ")}`].filter(Boolean).join(" · ");
    const igual = sacola.find(i => i.n === n && i.trio === trio && (i.refri || "") === refri && i.obs === obs && String(i.adds || []) === String(adds) && (i.extras || "") === extras);
    igual ? igual.qtd += qtd : sacola.push({ n, trio, refri, adds, extras, qtd, obs });
    salvar();
    avisar("Adicionado à sacola ✔");
    location.hash = "#/";
  };
  atualizar();
}

function telaSacola() {
  if (!sacola.length) {
    app.innerHTML = `${barra("Sacola")}<div class="vazio"><p>Sua sacola está vazia.</p><br><a class="btn" href="#/">Ver cardápio</a></div>`;
    return;
  }
  app.innerHTML = `
    ${barra("Sacola")}
    ${statusHTML()}
    <div class="titulo-sec">Itens</div>
    ${sacola.map((i, k) => `
      <div class="item-sacola">
        <div><b>${nomeItem(i)}</b><small>${ITENS[i.n].desc}</small>${i.extras ? `<small>${i.extras}</small>` : ""}${i.obs ? `<small>Obs.: ${esc(i.obs)}</small>` : ""}<div class="preco">${real(precoItem(i))}</div><button class="remover" data-rm="${k}">🗑 Remover</button></div>
        <div class="qtd"><button data-k="${k}" data-d="-1" aria-label="Diminuir">−</button><span>${i.qtd}</span><button data-k="${k}" data-d="1" aria-label="Aumentar">+</button></div>
      </div>`).join("")}
    <div class="bloco"><a href="#/">+ Adicionar mais itens</a></div>

    <form id="form">
      <div class="titulo-sec">Seus dados</div>
      <div class="bloco">
        <label class="campo" for="nome">Nome</label>
        <input id="nome" type="text" required autocomplete="name" maxlength="60">
        <label class="campo">Como quer receber?</label>
        <label class="opcao"><span>Retirar no local<br><small class="dica">${LOJA.endereco}</small></span><input type="radio" name="receber" value="retirada" checked></label>
        <label class="opcao"><span>Entrega por motoboy<br><small class="dica">${real(LOJA.taxaKm)} por km</small></span><input type="radio" name="receber" value="entrega"></label>
        <div id="campoEntrega" hidden>
          <label class="campo" for="endereco">Endereço de entrega</label>
          <input id="endereco" type="text" maxlength="150" autocomplete="street-address" placeholder="Rua, número, bairro, ponto de referência">
          <button type="button" class="btn-sec" id="calcular">📍 Calcular taxa pela minha localização</button>
          <p class="dica" id="infoTaxa">Toque no botão estando no endereço de entrega.</p>
        </div>
        <label class="campo" for="pagamento">Forma de pagamento</label>
        <select id="pagamento" required>${LOJA.pagamentos.map(p => `<option>${p}</option>`).join("")}</select>
        <div id="campoTroco" hidden>
          <label class="campo" for="troco">Troco para quanto? (opcional)</label>
          <input id="troco" type="text" inputmode="decimal" maxlength="10" placeholder="Ex.: 50">
        </div>
      </div>
      <div class="totais" id="totais"></div>
      <div class="bloco"><button class="btn" id="enviar" type="submit">Enviar pedido pelo WhatsApp</button>
        <p id="erro" class="vazio" style="padding:8px 0" hidden></p></div>
    </form>`;

  app.querySelectorAll(".qtd button").forEach(b => b.onclick = () => {
    const i = sacola[b.dataset.k];
    i.qtd += +b.dataset.d;
    if (i.qtd < 1) sacola.splice(b.dataset.k, 1);
    salvar(); telaSacola();
  });
  app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { sacola.splice(b.dataset.rm, 1); salvar(); telaSacola(); });

  const form = document.getElementById("form");
  const ent = { km: null, taxa: null, lat: null, lon: null }; // taxa null = a combinar
  const entrega = () => form.receber.value === "entrega";
  const total = () => subtotal() + (entrega() && ent.taxa ? ent.taxa : 0);
  const info = document.getElementById("infoTaxa");
  document.getElementById("calcular").onclick = () => {
    if (!navigator.geolocation) return (info.textContent = "Seu celular não informou a localização. A taxa será combinada pelo WhatsApp.");
    info.textContent = "Pegando sua localização…";
    navigator.geolocation.getCurrentPosition(async pos => {
      info.textContent = "Calculando a distância…";
      ent.lat = pos.coords.latitude; ent.lon = pos.coords.longitude;
      ent.km = await distanciaKm(ent.lat, ent.lon);
      ent.taxa = taxaEntrega(ent.km);
      info.textContent = `Distância até a loja: ${ent.km.toFixed(1).replace(".", ",")} km → taxa de ${real(ent.taxa)}`;
      atualizar();
    }, () => { info.textContent = "Não conseguimos sua localização. A taxa será combinada pelo WhatsApp."; },
    { enableHighAccuracy: true, timeout: 15000 });
  };
  const atualizar = () => {
    document.getElementById("campoTroco").hidden = form.pagamento.value !== "Dinheiro";
    document.getElementById("campoEntrega").hidden = !entrega();
    form.endereco.required = entrega();
    document.getElementById("totais").innerHTML = entrega() ? `
      <div><span>Subtotal</span><span>${real(subtotal())}</span></div>
      <div><span>Entrega${ent.km ? ` (${ent.km.toFixed(1).replace(".", ",")} km)` : ""}</span><span>${ent.taxa ? real(ent.taxa) : "a combinar"}</span></div>
      <div class="total"><span>Total</span><span>${real(total())}</span></div>` : `
      <div class="total"><span>Total</span><span>${real(subtotal())}</span></div>`;
    const erro = !estaAberto() ? "A loja está fechada no momento." : subtotal() < LOJA.pedidoMinimo ? `Pedido mínimo: ${real(LOJA.pedidoMinimo)}.` : "";
    document.getElementById("enviar").disabled = !!erro;
    const p = document.getElementById("erro"); p.textContent = erro; p.hidden = !erro;
  };
  form.onchange = atualizar;
  form.onsubmit = e => {
    e.preventDefault();
    const msg = montarMensagem({
      nome: form.nome.value.trim(),
      pagamento: form.pagamento.value, troco: form.troco.value.trim(),
      entrega: entrega() ? { ...ent, endereco: form.endereco.value.trim() } : null,
    });
    window.open(`https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
    sacola = []; salvar();
    app.innerHTML = `${barra("Pedido enviado")}<div class="vazio"><p>✅ Seu pedido foi aberto no WhatsApp.<br>É só tocar em <b>enviar</b> lá na conversa!</p><br><a class="btn" href="#/">Voltar ao cardápio</a></div>`;
  };
  atualizar();
}

// Entrega: km arredondado para cima × R$ por km (2,3 km → 3 km)
const taxaEntrega = km => Math.ceil(km) * LOJA.taxaKm;

// Distância de carro pelas ruas (OSRM, grátis); se falhar, linha reta × 1,3
async function distanciaKm(lat, lon) {
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${LOJA.lon},${LOJA.lat};${lon},${lat}?overview=false`, { signal: AbortSignal.timeout(8000) });
    const d = await r.json();
    if (d.code === "Ok") return d.routes[0].distance / 1000;
  } catch {}
  // ponytail: estimativa quando o serviço de rotas não responde; ruas costumam dar ~30% a mais que a linha reta
  const rad = x => x * Math.PI / 180;
  const a = Math.sin(rad(lat - LOJA.lat) / 2) ** 2 + Math.cos(rad(LOJA.lat)) * Math.cos(rad(lat)) * Math.sin(rad(lon - LOJA.lon) / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a)) * 1.3;
}

function montarMensagem({ nome, pagamento, troco, entrega = null }) {
  const num = String(Math.floor(1000 + Math.random() * 9000)); // nº curto pra loja casar a nota com a conversa
  const taxa = entrega?.taxa || null;
  const total = subtotal() + (taxa || 0);
  const km = entrega?.km ? `${entrega.km.toFixed(1).replace(".", ",")} km` : "";
  return [
    `*Novo pedido #${num} – ${LOJA.nome}*`, "",
    ...sacola.map(i => `${i.qtd}x ${nomeItem(i)} – ${real(precoItem(i))}${i.extras ? `\n   ${i.extras}` : ""}${i.obs ? `\n   Obs.: ${i.obs}` : ""}`), "",
    ...(entrega ? [`Subtotal: ${real(subtotal())}`, `Entrega: ${taxa ? `${real(taxa)} (${km})` : "a combinar"}`] : []),
    `*Total: ${real(total)}*`, "",
    `Nome: ${nome}`,
    ...(entrega ? [`🛵 Entrega em: ${entrega.endereco}`, ...(entrega.lat ? [`Localização: https://maps.google.com/?q=${entrega.lat.toFixed(6)},${entrega.lon.toFixed(6)}`] : [])] : ["Vou retirar no local"]),
    // a loja imprime colando esta mensagem em nota.html — se mudar o formato aqui, ajuste lerTexto() lá
    `Pagamento: ${pagamento}${pagamento === "Dinheiro" && troco ? ` (troco para R$ ${troco})` : ""}`,
  ].join("\n");
}

// ===== Navegação: #/ , #/produto/3 , #/sacola , #/perfil =====
function rotear() {
  const [, tela, arg] = location.hash.split("/");
  const v = tela || "inicio";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("ativo", a.dataset.v === v));
  document.getElementById("nav").hidden = v === "produto";
  ({ produto: () => telaProduto(+arg), sacola: telaSacola, perfil: telaPerfil }[v] || telaInicio)();
  scrollTo(0, 0);
}
addEventListener("hashchange", rotear);
atualizarContador();
rotear();
